# Publishes the site to GitHub Pages.
#
# site/ is self-contained — every page references assets/ by a relative path — so the
# directory is uploaded as-is. No staging, no path rewriting: what is served is exactly
# what `python3 gen.py` produced and what the local preview shows.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every referenced asset is present
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys

          root = pathlib.Path("site")
          pattern = re.compile(r'(?:src|href|srcset)="([^"]*)"')
          missing = []
          for page in sorted(root.rglob("index.html")):
              text = page.read_text(encoding="utf-8")
              for attr in pattern.findall(text):
                  # srcset is a comma-separated list of "url widthdescriptor" pairs.
                  for ref in (c.strip().split()[0] for c in attr.split(",") if c.strip()):
                      if "assets/" not in ref:
                          continue
                      target = (page.parent / ref).resolve()
                      if not target.is_file():
                          missing.append(f"{page}: {ref}")
          for m in missing:
              print("missing:", m)
          print(f"checked {len(list(root.rglob('index.html')))} pages")
          sys.exit(1 if missing else 0)
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
