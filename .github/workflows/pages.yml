# Publishes the site to GitHub Pages.
#
# site/ is self-contained — index.html references assets/ beside it — so the directory
# is uploaded as-is. No staging, no path rewriting: what is served is exactly what
# `python3 gen.py` produced and what the local preview shows.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every referenced asset is present
        run: |
          set -euo pipefail
          missing=0
          for p in $(grep -oE '(src|href|srcset)="[^"]*"' site/index.html \
                     | grep -oE '(^|[" ,])assets/[^ ",]*' | tr -d '" ,' | sort -u); do
            [ -f "site/$p" ] || { echo "missing: site/$p"; missing=1; }
          done
          [ "$missing" -eq 0 ]

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
